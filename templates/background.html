<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}智慧农作物管理系统{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .app-body {
            position: relative;
            background: #0f2519;
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        .app-bg-image,
        .app-bg-overlay,
        .app-bg-grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .app-bg-image {
            z-index: 0;
            background-image:
                linear-gradient(120deg, rgba(8, 24, 16, 0.74), rgba(16, 46, 30, 0.58)),
                url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1920&q=80");
            background-size: cover;
            background-position: center;
            transform: scale(1.05);
            animation: backgroundShift 36s ease-in-out infinite alternate;
        }

        .app-bg-overlay {
            z-index: 1;
            background:
                radial-gradient(1200px 500px at 80% 0%, rgba(151, 208, 84, 0.16), transparent 60%),
                radial-gradient(900px 460px at 0% 100%, rgba(73, 156, 98, 0.15), transparent 64%);
        }

        .app-bg-grid {
            z-index: 2;
            opacity: 0.18;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to bottom, transparent 8%, rgba(0, 0, 0, 0.85) 36%, rgba(0, 0, 0, 0.8) 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 8%, rgba(0, 0, 0, 0.85) 36%, rgba(0, 0, 0, 0.8) 100%);
        }

        @keyframes backgroundShift {
            0% { background-position: center center, 50% 48%; }
            100% { background-position: center center, 50% 56%; }
        }

        .content-wrapper {
            width: 100%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-color: rgba(255, 255, 255, 0.22) !important;
            background-color: rgba(255, 255, 255, 0.82) !important;
        }

        .content-wrapper.layout-fullbleed {
            background: transparent !important;
            border: 0 !important;
            box-shadow: none !important;
            padding: 0 !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="app-body min-vh-100 overflow-x-hidden d-flex align-items-center py-4 py-md-5">
    <div class="app-bg-image" aria-hidden="true"></div>
    <div class="app-bg-overlay" aria-hidden="true"></div>
    <div class="app-bg-grid" aria-hidden="true"></div>

    <div class="{% block content_shell_class %}container-fluid position-relative px-3 px-sm-4 px-lg-5 mx-auto{% endblock %}" style="z-index: 10; {% block content_shell_style %}max-width: min(100%, 1600px);{% endblock %}">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="content-wrapper bg-white bg-opacity-75 rounded-4 shadow-lg p-3 p-sm-4 p-lg-5 border {% block content_wrapper_class %}{% endblock %}">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </div>
    </div>

    {% block body_modals %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
