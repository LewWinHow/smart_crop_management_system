{% extends "navigation_bar.html" %}

{% block title %}Add Employee - Smart Crop Management{% endblock %}

{% block page_content %}
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-8">
            <div class="mb-4">
                <h2 class="fw-bold text-success-emphasis mt-2 mb-1">Add employee</h2>
            </div>

            <form method="post" enctype="multipart/form-data">
                <div class="p-0">
                    {% csrf_token %}

                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold" for="id_username">Username</label>
                            <input type="text" id="id_username" name="username" class="form-control"
                                   placeholder="Example: lewwinhow">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="id_password1">Password</label>
                            <input type="password" id="id_password1" name="password1" class="form-control"
                                   placeholder="Example: (XiaoHao6070)">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="id_password2">Confirm password</label>
                            <input type="password" id="id_password2" name="password2" class="form-control"
                                   placeholder="Example: (XiaoHao6070)">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="id_first_name">First name</label>
                            <input type="text" id="id_first_name" name="first_name" class="form-control"
                                   placeholder="Example: Win How">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="id_last_name">Last name</label>
                            <input type="text" id="id_last_name" name="last_name" class="form-control"
                                   placeholder="Example: Lew">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="id_email">Email</label>
                            <input type="email" id="id_email" name="email" class="form-control"
                                   placeholder="Example: xiaohao6070@gmail.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="id_phone">Phone</label>
                            <input type="text" id="id_phone" name="phone" class="form-control"
                                   placeholder="Example: 60123456789">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="id_birth_date">Birth date</label>
                            <input type="date" id="id_birth_date" name="birth_date" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold" for="id_age">Age</label>
                            <input type="number" id="id_age" name="age" class="form-control"
                                   placeholder="Example: 25">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold" for="id_gender">Gender</label>
                            <select id="id_gender" name="gender" class="form-select">
                                <option value="1" selected>Male</option>
                                <option value="2">Female</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold" for="id_permission">Permission</label>
                            <select id="id_permission" name="permission" class="form-select">
                                <option value="1">Supervisor</option>
                                <option value="2">Administrator</option>
                                <option value="3" selected>Viewer</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold" for="id_is_active">Is active</label>
                            <select id="id_is_active" name="is_active" class="form-select">
                                <option value="1" selected>Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold" for="id_profile_image">Profile image</label>
                            <input type="file" id="id_profile_image" name="profile_image" class="form-control"
                                   accept="image/*">
                        </div>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 justify-content-end py-3">
                    <a href="{% url 'employee:get_all_employee' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">Create</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
