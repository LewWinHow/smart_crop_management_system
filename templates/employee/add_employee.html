{% extends "navigation_bar.html" %}

{% block title %}Add Employee - AI Oil Palm Mentor System{% endblock %}

{% block page_content %}
    <style>
        /* Fade-in animation for page content */
        .fade-in-content {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    
    <div class="row justify-content-center fade-in-content">
        <div class="col-12 col-lg-10 col-xl-8">
            <div class="mb-4">
                <h2 class="fw-bold text-success-emphasis mt-2 mb-1 d-flex align-items-center gap-2">
                    <i class="bi bi-person-plus-fill text-success" aria-hidden="true"></i>
                    Add employee
                </h2>
            </div>

            <form method="post" enctype="multipart/form-data">
                <div class="p-0">
                    {% csrf_token %}

                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold" for="username">
                                <i class="bi bi-person-fill me-1 text-success" aria-hidden="true"></i>
                                Username
                            </label>
                            <input type="text" id="username" name="username" class="form-control"
                                   placeholder="Example: lewwinhow">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="password">
                                <i class="bi bi-lock-fill me-1 text-success" aria-hidden="true"></i>
                                Password
                            </label>
                            <input type="password" id="password" name="password" class="form-control"
                                   placeholder="Example: (XiaoHao6070)">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="confirm_password">
                                <i class="bi bi-lock-fill me-1 text-success" aria-hidden="true"></i>
                                Confirm password
                            </label>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                                   placeholder="Example: (XiaoHao6070)">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="first_name">
                                <i class="bi bi-person-vcard me-1 text-success" aria-hidden="true"></i>
                                First name
                            </label>
                            <input type="text" id="first_name" name="first_name" class="form-control"
                                   placeholder="Example: Win How">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="last_name">
                                <i class="bi bi-person-vcard me-1 text-success" aria-hidden="true"></i>
                                Last name
                            </label>
                            <input type="text" id="last_name" name="last_name" class="form-control"
                                   placeholder="Example: Lew">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="email">
                                <i class="bi bi-envelope-fill me-1 text-success" aria-hidden="true"></i>
                                Email
                            </label>
                            <input type="email" id="email" name="email" class="form-control"
                                   placeholder="Example: xiaohao6070@gmail.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" for="phone">
                                <i class="bi bi-telephone-fill me-1 text-success" aria-hidden="true"></i>
                                Phone
                            </label>
                            <input type="text" id="phone" name="phone" class="form-control"
                                   placeholder="Example: 60123456789">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" for="birth_date">
                                <i class="bi bi-calendar-event-fill me-1 text-success" aria-hidden="true"></i>
                                Birth date
                            </label>
                            <input type="date" id="birth_date" name="birth_date" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold" for="age">
                                <i class="bi bi-calendar3 me-1 text-success" aria-hidden="true"></i>
                                Age
                            </label>
                            <input type="number" id="age" name="age" class="form-control"
                                   placeholder="Example: 25">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold" for="gender">
                                <i class="bi bi-gender-ambiguous me-1 text-success" aria-hidden="true"></i>
                                Gender
                            </label>
                            <select id="gender" name="gender" class="form-select">
                                <option value="1" selected>Male</option>
                                <option value="2">Female</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold" for="permission">
                                <i class="bi bi-shield-lock-fill me-1 text-success" aria-hidden="true"></i>
                                Permission
                            </label>
                            <select id="permission" name="permission" class="form-select">
                                <option value="1">Supervisor</option>
                                <option value="2">Administrator</option>
                                <option value="3" selected>Viewer</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label fw-semibold" for="is_active">
                                <i class="bi bi-check-circle-fill me-1 text-success" aria-hidden="true"></i>
                                Is active
                            </label>
                            <select id="is_active" name="is_active" class="form-select">
                                <option value="1" selected>Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold" for="profile_image">
                                <i class="bi bi-image-fill me-1 text-success" aria-hidden="true"></i>
                                Profile image
                            </label>
                            <input type="file" id="profile_image" name="profile_image" class="form-control"
                                   accept="image/*">
                        </div>
                    </div>
                </div>
                <div class="d-flex flex-wrap gap-2 justify-content-end py-3">
                    <a href="{% url 'employee:get_all_employee' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">Create</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
